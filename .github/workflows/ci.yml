name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is available on the runner, so the Testcontainers integration tests run here too
      - name: Build and test
        run: mvn -B verify
        working-directory: SpringEcomAI

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e-com-Frontend/package-lock.json
      - run: npm ci
        working-directory: e-com-Frontend
      - run: npm run lint
        working-directory: e-com-Frontend
      - run: npm run check:design
        working-directory: e-com-Frontend
      - run: npm run build
        working-directory: e-com-Frontend
