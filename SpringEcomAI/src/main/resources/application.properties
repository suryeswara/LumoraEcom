spring.application.name=SpringEcomAI

# Paths below are relative to the process working directory. Run from SpringEcomAI
# so ../.env resolves to the project-root .env (or place a .env in this directory).
# Environment variables can also provide DB_PASSWORD or POSTGRES_PASSWORD.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

#Postgres Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:ecommerce}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.driver-class-name=org.postgresql.Driver

#OpenAI / Gemini Configuration (Using Google AI Studio OpenAI-compatible endpoint)
# Set GEMINI_API_KEY or OPENAI_API_KEY in your environment
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:not-configured}}
spring.ai.openai.chat.options.model=gemini-flash-lite-latest
spring.ai.openai.embedding.options.model=gemini-embedding-001
spring.ai.openai.embedding.options.dimensions=1536
spring.main.allow-bean-definition-overriding=true


# Set max file size for single file upload (e.g., 100MB)
spring.servlet.multipart.max-file-size=100MB
# Set max request size for total upload (e.g., multiple files in a single request)
spring.servlet.multipart.max-request-size=100MB

# ---- Security / JWT ----
# Base64-encoded secret, at least 32 bytes. Generate: openssl rand -base64 32
# If JWT_SECRET is not set, an EPHEMERAL key is generated at startup (tokens die on restart) - dev only.
app.jwt.secret=${JWT_SECRET:}
# Token lifetime in ms (default 1 hour)
app.jwt.expiration-ms=3600000
# Comma-separated list of frontend origins allowed by CORS
app.cors.allowed-origins=http://localhost:5173
# Optional: an ADMIN account is created at startup when BOTH are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Stock at or below this number raises a LOW_STOCK alert for admins
app.stock.low-threshold=5
# We issue/verify JWTs ourselves, so disable Spring Boot's generated default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.docker.compose.enabled=false